<header class="example-header">
<a class="example-skip-link" href="#main-content">Skip to content</a>
<div class="example-header-top">
	<a class="example-header-left" href="[example_home_url]/" aria-label="Fast WordPress, home">
		<span class="example-header-brand">
			<span class="example-header-brand-meter" aria-hidden="true">
				<span class="dashicons dashicons-performance"></span>
			</span>
			<span class="example-header-brand-wordmark">
				<span class="example-header-brand-text">Fast <span class="example-header-brand-mark">WordPress</span></span>
			</span>
		</span>
	</a>
	<nav class="example-header-right example-header-desktop-nav" aria-label="Primary">
		<ul class="example-top-menu-list">
			<li><a class="example-top-menu-item" href="[example_home_url]/">Home</a></li>
			<li><a class="example-top-menu-item" href="[example_home_url]/about-us/">About</a></li>
			<li><a class="example-top-menu-item" href="[example_home_url]/portfolio/">Portfolio</a></li>
			<li><a class="example-top-menu-item" href="[example_home_url]/blog/">Blog</a></li>
			<li><a class="example-top-menu-item example-top-menu-cta" href="[example_home_url]/contact-us/">Contact</a></li>
			<li>
				<button type="button" class="example-header-search-toggle" aria-expanded="false" aria-controls="example-header-search-form-wrap" aria-label="Open search">
					<span class="dashicons dashicons-search" aria-hidden="true"></span>
				</button>
			</li>
			<li>
				[example_theme_toggle]
			</li>
		</ul>
	</nav>
	<div class="example-header-search-form-wrap" id="example-header-search-form-wrap" aria-hidden="true">
		<form role="search" method="get" action="[example_home_url]/" class="example-header-search-form">
			<input type="search" name="s" class="example-header-search-input" id="example-header-search-input" placeholder="Search..." aria-label="Search website" autocomplete="off">
			<button type="submit" class="example-header-search-submit" aria-label="Submit search">
				<span class="dashicons dashicons-arrow-right-alt2" aria-hidden="true"></span>
			</button>
			<button type="button" class="example-header-search-close" id="example-header-search-close" aria-label="Close search">
				<span class="dashicons dashicons-no-alt" aria-hidden="true"></span>
			</button>
		</form>
	</div>
	<div class="example-header-controls">
		<button type="button" class="example-header-menu-toggle" id="example-header-menu-toggle" aria-expanded="false" aria-controls="example-header-nav-drawer" aria-label="Open menu">
			<span class="example-screen-reader-text">Menu</span>
			<span class="dashicons dashicons-menu example-header-menu-icon-closed" aria-hidden="true"></span>
			<span class="dashicons dashicons-no-alt example-header-menu-icon-open" aria-hidden="true"></span>
		</button>
		<button type="button" class="example-header-search-toggle" aria-expanded="false" aria-controls="example-header-search-form-wrap" aria-label="Open search">
			<span class="dashicons dashicons-search" aria-hidden="true"></span>
		</button>
	</div>
</div>
<div class="example-header-drawer-backdrop" id="example-header-drawer-backdrop" aria-hidden="true"></div>
<nav class="example-header-drawer" id="example-header-nav-drawer" aria-label="Mobile menu" aria-hidden="true">
	<div class="example-header-drawer-top">
		<a class="example-header-drawer-brand" href="[example_home_url]/" aria-label="Fast WordPress, home">
			<span class="example-header-brand example-header-brand--drawer">
				<span class="example-header-brand-meter" aria-hidden="true">
					<span class="dashicons dashicons-performance"></span>
				</span>
				<span class="example-header-brand-wordmark">
					<span class="example-header-brand-text">Fast <span class="example-header-brand-mark">WordPress</span></span>
				</span>
			</span>
		</a>
		<button type="button" class="example-header-drawer-close" id="example-header-drawer-close" aria-label="Close menu">
			<span class="example-screen-reader-text">Close</span>
			<span class="dashicons dashicons-no" aria-hidden="true"></span>
		</button>
	</div>
	<div class="example-header-drawer-group">
		<ul class="example-header-drawer-menu">
			<li><a class="example-header-drawer-link" href="[example_home_url]/">Home</a></li>
			<li><a class="example-header-drawer-link" href="[example_home_url]/about-us/">About</a></li>
			<li><a class="example-header-drawer-link" href="[example_home_url]/portfolio/">Portfolio</a></li>
			<li><a class="example-header-drawer-link" href="[example_home_url]/blog/">Blog</a></li>
			<li><a class="example-header-drawer-link example-header-drawer-link--cta" href="[example_home_url]/contact-us/">Contact</a></li>
		</ul>
	</div>
	<div class="example-header-drawer-footer">
		[example_theme_toggle]
	</div>
</nav>
</header>
